name: cflite-pr

# ClusterFuzzLite on pull requests: builds the libFuzzer targets of fuzz/ (.clusterfuzzlite/) and
# fuzzes the code the PR changes. Corpora come from the cflite-batch runs.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'fuzz/**'
      - 'CMakeLists.txt'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite-pr.yml'
  workflow_dispatch:

permissions: read-all

jobs:
  pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: cflite-pr-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
