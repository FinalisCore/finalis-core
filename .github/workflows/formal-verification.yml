name: formal-verification

on:
  push:
    branches-ignore:
      - "windows-installer-test"
    paths:
      - "formal/**"
      - "scripts/run_tlc.sh"
      - "docs/spec/CHECKPOINT_DERIVATION_SPEC.md"
      - "docs/spec/AVAILABILITY_STATE_COMPLETENESS.md"
      - "docs/spec/TWO_PHASE_FINALITY.md"
      - "docs/LIVE_PROTOCOL.md"
      - "README.md"
      - ".github/workflows/formal-verification.yml"
  pull_request:
    branches-ignore:
      - "windows-installer-test"
    paths:
      - "formal/**"
      - "scripts/run_tlc.sh"
      - "docs/spec/CHECKPOINT_DERIVATION_SPEC.md"
      - "docs/spec/AVAILABILITY_STATE_COMPLETENESS.md"
      - "docs/spec/TWO_PHASE_FINALITY.md"
      - "docs/LIVE_PROTOCOL.md"
      - "README.md"
      - ".github/workflows/formal-verification.yml"

jobs:
  tlc-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre curl

      - name: Install tla2tools.jar
        run: |
          mkdir -p "$HOME/tools/tla"
          curl -L -o "$HOME/tools/tla/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

      - name: Run TLC suite
        run: |
          chmod +x scripts/run_tlc.sh
          ./scripts/run_tlc.sh

      # Two-phase finality voting rules (formal/README.md). The abstract model is checked
      # exhaustively: Agreement must hold, and the reachability and mutation configs must be
      # violated, showing finality is reachable and that the lock and vote-floor rules are needed.
      - name: Run TLC two-phase finality suite
        run: |
          spec=formal/two_phase_finality_abstract.tla
          ./scripts/run_tlc.sh --spec "$spec" --config formal/two_phase_finality_abstract.cfg
          ./scripts/run_tlc.sh --spec "$spec" --config formal/two_phase_finality_abstract_reach.cfg \
            --expect-violation NothingFinalizes
          ./scripts/run_tlc.sh --spec "$spec" --config formal/two_phase_finality_abstract_reach_cross.cfg \
            --expect-violation NoCrossRoundFinality
          ./scripts/run_tlc.sh --spec "$spec" --config formal/two_phase_finality_abstract_lock_mutation.cfg \
            --expect-violation Agreement
          ./scripts/run_tlc.sh --spec "$spec" --config formal/two_phase_finality_abstract_floor_mutation.cfg \
            --expect-violation Agreement

      - name: Upload TLC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-tlc-runs
          path: formal/tlc_runs/**
