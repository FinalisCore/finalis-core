name: formal-verification

on:
  push:
    branches:
      - "main"
    paths:
      - "formal/**"
      - "scripts/run_tlc.sh"
      - "docs/spec/CHECKPOINT_DERIVATION_SPEC.md"
      - "docs/spec/AVAILABILITY_STATE_COMPLETENESS.md"
      - "docs/spec/TWO_PHASE_FINALITY.md"
      - "docs/CONSENSUS.md"
      - "docs/LIVE_PROTOCOL.md"
      - "README.md"
      - ".github/workflows/formal-verification.yml"
  pull_request:
    branches-ignore:
      - "windows-installer-test"
    paths:
      - "formal/**"
      - "scripts/run_tlc.sh"
      - "docs/spec/CHECKPOINT_DERIVATION_SPEC.md"
      - "docs/spec/AVAILABILITY_STATE_COMPLETENESS.md"
      - "docs/spec/TWO_PHASE_FINALITY.md"
      - "docs/CONSENSUS.md"
      - "docs/LIVE_PROTOCOL.md"
      - "README.md"
      - ".github/workflows/formal-verification.yml"

permissions:
  contents: read

jobs:
  tlc-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Java and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre curl

      - name: Install tla2tools.jar
        env:
          TLA_VERSION: v1.7.4
          TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
        run: |
          mkdir -p "$HOME/tools/tla"
          curl -fsSL -o "$HOME/tools/tla/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_VERSION}/tla2tools.jar"
          echo "${TLA_SHA256}  $HOME/tools/tla/tla2tools.jar" | sha256sum -c -

      - name: Run TLC suite
        run: |
          chmod +x scripts/run_tlc.sh
          ./scripts/run_tlc.sh

      # Two-phase finality voting rules (formal/README.md). The abstract model is checked
      # exhaustively: Agreement must hold, and the reachability and mutation configs must be
      # violated, showing finality is reachable and that the lock and vote-floor rules are needed.
      - name: Run TLC two-phase finality suite
        run: |
          spec=formal/two_phase_finality_abstract.tla
          ./scripts/run_tlc.sh --spec "$spec" --config formal/two_phase_finality_abstract.cfg
          ./scripts/run_tlc.sh --spec "$spec" --config formal/two_phase_finality_abstract_reach.cfg \
            --expect-violation NothingFinalizes
          ./scripts/run_tlc.sh --spec "$spec" --config formal/two_phase_finality_abstract_reach_cross.cfg \
            --expect-violation NoCrossRoundFinality
          ./scripts/run_tlc.sh --spec "$spec" --config formal/two_phase_finality_abstract_lock_mutation.cfg \
            --expect-violation Agreement
          ./scripts/run_tlc.sh --spec "$spec" --config formal/two_phase_finality_abstract_floor_mutation.cfg \
            --expect-violation Agreement

      # Time-locked transactions (formal/README.md, "Timed Release Model"): the safety invariants must
      # hold exhaustively; the reachability configs and the four rule mutations must be violated.
      - name: Run TLC timed release suite
        run: |
          spec=formal/timed_release.tla
          ./scripts/run_tlc.sh --spec "$spec" --config formal/timed_release.cfg
          ./scripts/run_tlc.sh --spec "$spec" --config formal/timed_release_reach_applied.cfg --expect-violation NothingApplied
          ./scripts/run_tlc.sh --spec "$spec" --config formal/timed_release_reach_long_opened.cfg --expect-violation NoLongOpened
          ./scripts/run_tlc.sh --spec "$spec" --config formal/timed_release_reach_long_expired.cfg --expect-violation NoLongExpired
          ./scripts/run_tlc.sh --spec "$spec" --config formal/timed_release_sign_early_mutation.cfg --expect-violation NoEarlyKey
          ./scripts/run_tlc.sh --spec "$spec" --config formal/timed_release_late_inclusion_mutation.cfg \
            --expect-violation SettleOnTime
          ./scripts/run_tlc.sh --spec "$spec" --config formal/timed_release_standalone_body_mutation.cfg \
            --expect-violation NoBondLoss
          ./scripts/run_tlc.sh --spec "$spec" --config formal/timed_release_settle_last_mutation.cfg \
            --expect-violation NoBondLoss

      - name: Upload TLC artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formal-tlc-runs
          path: formal/tlc_runs/**
