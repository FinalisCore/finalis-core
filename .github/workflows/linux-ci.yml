name: linux-ci

on:
  push:
    branches-ignore:
      - 'windows-installer-test'
  pull_request:
    branches-ignore:
      - 'windows-installer-test'
  workflow_dispatch:

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FINALIS_TEST_QUIET_LOGS: '1'
  # Node/lightserver/explorer only: no local nginx build, no Qt wallet.
  CMAKE_COMMON_FLAGS: >-
    -G Ninja
    -DFINALIS_BUILD_NGINX=OFF
    -DFINALIS_GENERATE_NGINX_CONFIG=OFF

permissions:
  contents: read

jobs:
  release:
    name: build + ctest (Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config \
            libssl-dev libsodium-dev librocksdb-dev nlohmann-json3-dev
      - name: Configure
        run: cmake -S . -B build $CMAKE_COMMON_FLAGS -DCMAKE_BUILD_TYPE=Release -DFINALIS_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 5400 -LE known-defect
      # Open production defects (tests/KNOWN_DEFECTS.md): reported on every run, not a gate until fixed.
      - name: Known-defect regression tests (expected to fail)
        continue-on-error: true
        run: |
          set +e
          ctest --test-dir build --output-on-failure --timeout 5400 -L known-defect
          status=$?
          echo "### Known-defect regression tests: $([ $status -eq 0 ] && echo 'all pass (drop the known-defect tags)' || echo 'OPEN DEFECTS REPRODUCED') (tests/KNOWN_DEFECTS.md)" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Known-defect fuzz reproducers (expected to fail)
        continue-on-error: true
        run: |
          set +e
          fuzz/replay_known_defects.sh build | tee known_defect_fuzz.txt
          status=${PIPESTATUS[0]}
          { echo "### Known-defect fuzz reproducers"; echo '```'; cat known_defect_fuzz.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Fuzz smoke
        run: |
          # Storage faults off: the configuration that must stay clean (faults on: the step above).
          FINALIS_FUZZ_FAULTS=0 FINALIS_FUZZ_ITERS=16 ./build/fuzz_consensus_persistence
          ./build/fuzz_p2p_frame
          ./build/fuzz_tx_parse
          ./build/fuzz_consensus_msgs
          ./build/fuzz_consensus_node
          ./build/fuzz_smt
          ./build/fuzz_confidential
          ./build/fuzz_wire_codecs
          ./build/fuzz_sync
          ./build/fuzz_timed_execution
          scripts/fuzz_replay_corpus.sh build

  sanitize:
    name: ASan/UBSan shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      FINALIS_TEST_SHARD_INDEX: ${{ matrix.shard }}
      FINALIS_TEST_SHARD_COUNT: '4'
      # Sanitized builds run several times slower; scale ci_timeout_seconds() waits.
      FINALIS_CI_TIMEOUT_SCALE: '3'
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config \
            libssl-dev libsodium-dev librocksdb-dev nlohmann-json3-dev
      - name: Configure
        run: cmake -S . -B build $CMAKE_COMMON_FLAGS -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFINALIS_SANITIZE=ON
      - name: Build
        run: cmake --build build --target finalis-tests fuzz_p2p_frame fuzz_tx_parse fuzz_consensus_msgs fuzz_consensus_node
          fuzz_smt fuzz_confidential fuzz_wire_codecs fuzz_sync fuzz_timed_execution -j"$(nproc)"
      - name: Test
        run: ./build/finalis-tests
      - name: Fuzz smoke
        if: matrix.shard == 0
        run: |
          ./build/fuzz_p2p_frame
          ./build/fuzz_tx_parse
          ./build/fuzz_consensus_msgs
          ./build/fuzz_consensus_node
          ./build/fuzz_smt
          ./build/fuzz_confidential
          ./build/fuzz_wire_codecs
          ./build/fuzz_sync
          ./build/fuzz_timed_execution
          scripts/fuzz_replay_corpus.sh build

  tsan:
    name: TSan shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      FINALIS_TEST_SHARD_INDEX: ${{ matrix.shard }}
      FINALIS_TEST_SHARD_COUNT: '4'
      FINALIS_CI_TIMEOUT_SCALE: '5'
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=4:suppressions=${{ github.workspace }}/tests/tsan.supp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config \
            libssl-dev libsodium-dev librocksdb-dev nlohmann-json3-dev
      # TSan cannot map its shadow memory with the 32-bit mmap ASLR entropy of current runner kernels.
      - name: Lower mmap ASLR entropy
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake -S . -B build $CMAKE_COMMON_FLAGS -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFINALIS_SANITIZE_THREAD=ON -DFINALIS_BUILD_FUZZ=OFF
      - name: Build
        run: cmake --build build --target finalis-tests -j"$(nproc)"
      - name: Test
        run: ./build/finalis-tests
